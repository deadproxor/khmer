<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1f3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ខ្មែរ">
<title>ខ្មែរ — Учи кхмерский</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">

<style>
:root {
  --bg: #1a1f3a;
  --bg2: #252b4a;
  --bg3: #2e3560;
  --gold: #e8a94d;
  --gold-dim: #c48830;
  --cream: #f5f0e8;
  --cream-dim: #a09880;
  --green: #5cba8a;
  --red: #e05c5c;
  --blue: #5c8ae0;
  --card-shadow: 0 8px 32px rgba(0,0,0,0.4);
  --radius: 16px;
  --radius-sm: 10px;
  --font-ui: 'Inter', system-ui, sans-serif;
  --font-khmer: 'Noto Sans Khmer', sans-serif;
}

[data-theme="light"] {
  --bg: #f0ede6;
  --bg2: #ffffff;
  --bg3: #e4e0d8;
  --gold: #b8762a;
  --gold-dim: #9a6020;
  --cream: #1a1a1a;
  --cream-dim: #666655;
  --card-shadow: 0 8px 32px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font-ui);
  overflow: hidden;
  user-select: none;
}

/* ── APP SHELL ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: var(--bg);
  z-index: 10;
  flex-shrink: 0;
}

.logo {
  font-family: var(--font-khmer);
  font-size: 22px;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.02em;
}

.header-stats {
  display: flex;
  align-items: center;
  gap: 12px;
}

.streak-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg2);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold);
}

.streak-badge .fire { font-size: 15px; }

.known-badge {
  font-size: 13px;
  color: var(--cream-dim);
  font-weight: 500;
}
.known-badge span { color: var(--cream); font-weight: 700; }

/* ── NAV TABS ── */
nav {
  display: flex;
  background: var(--bg2);
  margin: 0 16px;
  border-radius: var(--radius);
  padding: 3px;
  flex-shrink: 0;
  gap: 2px;
}

.tab {
  flex: 1;
  text-align: center;
  padding: 8px 4px;
  border-radius: 13px;
  font-size: 13px;
  font-weight: 600;
  color: var(--cream-dim);
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: transparent;
  letter-spacing: 0.01em;
}

.tab.active {
  background: var(--bg3);
  color: var(--cream);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ── CATEGORY FILTER ── */
.category-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  flex-shrink: 0;
  max-width: 100%;
}

.cat-pinned {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.cat-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
}
.cat-scroll::-webkit-scrollbar { display: none; }

.cat-chip {
  flex-shrink: 0;
  background: var(--bg2);
  border: 1.5px solid transparent;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--cream-dim);
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}
.cat-scroll .cat-chip:not(.active) { opacity: 0.72; }

.cat-chip.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(232,169,77,0.1);
}

.cat-chip.icon-chip {
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  border-color: var(--bg3);
}
.cat-chip.icon-chip.active {
  border-color: var(--gold);
  background: var(--gold);
  color: var(--bg);
}

/* ── SCREEN AREA ── */
#screen {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ── CARDS SCREEN ── */
#cards-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  gap: 16px;
}

/* Card — checkbox flip */
#card-flip { display: none; }

.card-wrap {
  position: relative;
  width: 100%;
}

.card-label {
  min-width: 300px;
  display: block;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.fav-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 5;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.15);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cream-dim);
  transition: transform 0.15s;
}
.fav-btn.active { color: var(--gold-dim); opacity: 0.85; }
.fav-btn:active { transform: scale(0.85); }

.card-face-front,
.card-face-back {
  width: 100%;
  background: var(--bg2);
  border-radius: 20px;
  box-shadow: var(--card-shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  gap: 10px;
  min-height: 210px;
  text-align: center;
}

/* back hidden by default */
.card-face-back { display: none; }

/* when checkbox checked: hide front, show back, hide label cursor */
#card-flip:checked ~ .card-wrap .card-face-front { display: none; }
#card-flip:checked ~ .card-wrap .card-face-back   { display: flex; }
/* #card-flip:checked ~ .card-wrap .card-label — no longer blocked after flip */

/* show rating buttons when checked */
#card-flip:checked ~ .rating-btns { opacity: 1; pointer-events: all; }

.card-eyebrow {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--cream-dim);
}

.card-khmer {
  font-family: var(--font-khmer);
  font-size: 52px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1.2;
  text-align: center;
}

.card-transcription {
  font-size: 14px;
  color: var(--cream-dim);
  letter-spacing: 0.03em;
  text-align: center;
}

.card-russian {
  font-size: 26px;
  font-weight: 700;
  color: var(--cream);
  text-align: center;
  margin-top: 4px;
}

.card-rus-trans {
  font-size: 14px;
  color: var(--cream-dim);
  font-style: italic;
}

.card-tap-hint {
  font-size: 12px;
  color: var(--cream-dim);
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  opacity: 0.7;
}

/* ── FAVORITES SCREEN (standalone) ── */
#favorites-screen {
  flex-direction: column;
  height: 100%;
  padding: 16px;
  gap: 10px;
  overflow: hidden;
}

.fav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.fav-back-btn {
  background: var(--bg2);
  border: 1px solid var(--bg3);
  border-radius: 10px;
  padding: 7px 14px;
  color: var(--cream);
  font-size: 13px;
  cursor: pointer;
}

.fav-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--cream-dim);
}

.fav-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--cream-dim);
  font-size: 13px;
  padding: 0 32px;
  line-height: 1.5;
}

.fav-nav-arrow {
  flex-shrink: 0;
  align-self: center;
  background: none;
  border: none;
  color: var(--gold);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 4px;
  opacity: 0.8;
}
.fav-nav-arrow:active { opacity: 0.4; }

.fav-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.fav-list::-webkit-scrollbar { display: none; }
.fav-list { scrollbar-width: none; }

.fav-card-item {
  scroll-snap-align: start;
  flex-shrink: 0;
  height: calc((100% - 30px) / 6);
  min-height: 160px;
  position: relative;
}
.fav-card-item .card-wrap { height: 100%; }
.fav-card-item .card-label { height: 100%; }
.fav-card-item .card-face-front,
.fav-card-item .card-face-back {
  min-height: 0;
  height: 100%;
  padding: 16px 20px;
  gap: 4px;
  box-sizing: border-box;
}
.fav-card-item .card-khmer { font-size: 30px; }
.fav-card-item .card-russian { font-size: 18px; }
.fav-card-item .card-transcription { font-size: 12px; }
.fav-card-item .card-tap-hint { display: none; }

/* class-based flip so several cards can flip independently on one screen */
.fav-card-flip { display: none; }
.fav-card-flip:checked ~ .card-wrap .card-face-front { display: none; }
.fav-card-flip:checked ~ .card-wrap .card-face-back   { display: flex; }

/* Rating buttons */
.rating-btns {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 360px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}

.rating-btn {
  flex: 1;
  padding: 14px 8px;
  border-radius: var(--radius);
  border: none;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  letter-spacing: 0.01em;
}
.rating-btn .sub { font-size: 10px; font-weight: 500; opacity: 0.75; }
.rating-btn:active { transform: scale(0.95); }

.btn-hard { background: rgba(224,92,92,0.15); color: var(--red); border: 1.5px solid rgba(224,92,92,0.3); }
.btn-ok   { background: rgba(92,138,224,0.15); color: var(--blue); border: 1.5px solid rgba(92,138,224,0.3); }
.btn-easy { background: rgba(92,186,138,0.15); color: var(--green); border: 1.5px solid rgba(92,186,138,0.3); }

.btn-hard:active { background: rgba(224,92,92,0.3); }
.btn-ok:active   { background: rgba(92,138,224,0.3); }
.btn-easy:active { background: rgba(92,186,138,0.3); }

/* Session counter */
.session-info {
  font-size: 13px;
  color: var(--cream-dim);
  text-align: center;
}
.session-info strong { color: var(--cream); }

/* Mode toggle (card direction) */
.mode-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.direction-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg2);
  border-radius: 20px;
  padding: 5px 12px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--cream-dim);
  border: none;
  transition: all 0.18s;
}
.direction-toggle:active { opacity: 0.7; }
.direction-toggle .arrow { color: var(--gold); }

/* Done state */
.done-card {
  width: 100%;
  max-width: 360px;
  background: var(--bg2);
  border-radius: 20px;
  padding: 40px 28px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  box-shadow: var(--card-shadow);
}
.done-icon { font-size: 56px; }
.done-title { font-size: 22px; font-weight: 700; }
.done-subtitle { font-size: 14px; color: var(--cream-dim); line-height: 1.5; }
.done-btn {
  background: var(--gold);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  padding: 14px 32px;
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
}
.done-btn:active { transform: scale(0.97); opacity: 0.9; }

/* ── QUIZ SCREEN ── */
#quiz-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 16px;
  overflow-y: auto;
}

.quiz-question {
  background: var(--bg2);
  border-radius: 20px;
  padding: 32px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: var(--card-shadow);
}

.quiz-khmer {
  font-family: var(--font-khmer);
  font-size: 48px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1.2;
}

.quiz-score {
  display: flex;
  gap: 16px;
  justify-content: center;
  font-size: 13px;
}
.score-correct { color: var(--green); font-weight: 600; }
.score-wrong   { color: var(--red); font-weight: 600; }

.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.quiz-option {
  background: var(--bg2);
  border: 2px solid transparent;
  border-radius: var(--radius);
  padding: 18px 12px;
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 600;
  color: var(--cream);
  cursor: pointer;
  transition: all 0.18s;
  text-align: center;
  line-height: 1.3;
}
.quiz-option:active { transform: scale(0.97); }
.quiz-option.correct { border-color: var(--green); background: rgba(92,186,138,0.15); color: var(--green); }
.quiz-option.wrong   { border-color: var(--red);   background: rgba(224,92,92,0.15);  color: var(--red); }

.quiz-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--cream-dim);
}
.quiz-progress-bar {
  flex: 1;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 0.3s;
}

/* ── STATS SCREEN ── */
#stats-screen {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.stats-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.stat-card {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 16px 12px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}
.stat-label {
  font-size: 11px;
  color: var(--cream-dim);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 0 2px;
}

/* Weekly chart */
.week-chart {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.week-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 70px;
}
.week-bar-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  height: 100%;
  justify-content: flex-end;
}
.week-bar {
  width: 100%;
  background: var(--gold);
  border-radius: 4px 4px 0 0;
  opacity: 0.8;
  min-height: 3px;
  transition: height 0.4s;
}
.week-bar.today { opacity: 1; }
.week-day {
  font-size: 10px;
  color: var(--cream-dim);
  font-weight: 500;
  text-align: center;
}
.week-count {
  font-size: 10px;
  color: var(--cream-dim);
  text-align: center;
  margin-top: -2px;
}

/* Category progress */
.cat-progress-list {
  background: var(--bg2);
  border-radius: var(--radius);
  overflow: hidden;
}
.cat-progress-item {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cat-progress-item:last-child { border-bottom: none; }
.cat-progress-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}
.cat-name { font-weight: 500; }
.cat-count { color: var(--cream-dim); font-size: 12px; }
.cat-bar-bg {
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}
.cat-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 0.5s;
}

/* Actions */
.actions-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.action-btn {
  width: 100%;
  background: var(--bg2);
  border: 1.5px solid var(--bg3);
  border-radius: var(--radius);
  padding: 14px 16px;
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 600;
  color: var(--cream);
  cursor: pointer;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.18s;
}
.action-btn:active { background: var(--bg3); }
.action-btn.danger { color: var(--red); border-color: rgba(224,92,92,0.3); }
.action-btn .ico { font-size: 18px; width: 24px; text-align: center; }

/* Toast */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg3);
  color: var(--cream);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transform: translateY(40px);
  transition: transform 0.3s;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-title { font-size: 18px; font-weight: 700; }
.modal-subtitle { font-size: 14px; color: var(--cream-dim); line-height: 1.5; }
.modal-btns { display: flex; gap: 10px; }
.modal-btn {
  flex: 1;
  padding: 14px;
  border-radius: var(--radius);
  border: none;
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.18s;
}
.modal-btn.cancel { background: var(--bg3); color: var(--cream); }
.modal-btn.confirm { background: var(--red); color: #fff; }
.modal-btn:active { opacity: 0.8; }

/* Bottom safe area */
.bottom-safe {
  height: max(16px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}

/* Empty state */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  padding: 32px;
}
.empty-icon { font-size: 48px; opacity: 0.5; }
.empty-text { font-size: 15px; color: var(--cream-dim); line-height: 1.5; }

/* Scroll fix */
#stats-screen::-webkit-scrollbar { display: none; }
#stats-screen { scrollbar-width: none; }
#quiz-screen::-webkit-scrollbar { display: none; }
#quiz-screen { scrollbar-width: none; }

/* Theme toggle */
.theme-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  border-radius: 8px;
  line-height: 1;
  transition: transform 0.2s;
}
.theme-btn:active { transform: scale(0.85); }

/* Loading */
.loading {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.loading-khmer {
  font-family: var(--font-khmer);
  font-size: 48px;
  color: var(--gold);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">ខ្មែរ</div>
    <div class="header-stats">
      <button class="theme-btn" id="theme-btn" title="Сменить тему">🌙</button>
      <div class="streak-badge"><span class="fire">🔥</span><span id="streak-count">0</span></div>
      <div class="known-badge">Знаю <span id="known-count">0</span>/<span id="total-count">0</span></div>
    </div>
  </header>

  <nav>
    <button class="tab active" data-tab="cards">Карточки</button>
    <button class="tab" data-tab="quiz">Квиз</button>
    <button class="tab" data-tab="stats">Статистика</button>
  </nav>

  <div class="category-bar" id="category-bar"></div>

  <div id="screen">
    <!-- CARDS -->
    <div id="cards-screen">
      <div class="loading">
        <div class="loading-khmer">ក</div>
        <div style="font-size:13px;color:var(--cream-dim)">Загрузка...</div>
      </div>
    </div>

    <!-- QUIZ (hidden) -->
    <div id="quiz-screen" style="display:none"></div>

    <!-- STATS (hidden) -->
    <div id="stats-screen" style="display:none"></div>

    <!-- FAVORITES (hidden, standalone view) -->
    <div id="favorites-screen" style="display:none"></div>
  </div>

  <div class="bottom-safe"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">Сбросить прогресс?</div>
    <div class="modal-subtitle" id="modal-subtitle">Весь прогресс будет удалён. Это действие нельзя отменить.</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" id="modal-cancel">Отмена</button>
      <button class="modal-btn confirm" id="modal-confirm">Сбросить</button>
    </div>
  </div>
</div>

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
const CATS = ['Все', ...new Set(DICT.map(w => w.cat))];
let state = {
  tab: 'cards',
  cat: 'Все',
  favoritesOpen: false,
  direction: 'kh2ru', // kh2ru | ru2kh
  cards: {
    flipped: false,
    queue: [],
    idx: 0,
    sessionStats: {correct:0, wrong:0},
    done: false,
  },
  quiz: {
    current: null,
    options: [],
    answered: false,
    correct: 0,
    wrong: 0,
    count: 0,
  },
};

// SRS data in localStorage
let srs = {}; // id -> { interval, ef, due, reviews }
let streakData = {}; // { lastDate, streak, history: [{date,count}] }
let favorites = {}; // id -> true

function loadStorage() {
  try {
    srs = JSON.parse(localStorage.getItem('khmer_srs') || '{}');
    streakData = JSON.parse(localStorage.getItem('khmer_streak') || '{"lastDate":null,"streak":0,"history":[]}');
    favorites = JSON.parse(localStorage.getItem('khmer_favorites') || '{}');
  } catch(e) {
    srs = {}; streakData = {lastDate:null,streak:0,history:[]}; favorites = {};
  }
}

function saveSRS() {
  try { localStorage.setItem('khmer_srs', JSON.stringify(srs)); } catch(e) {}
}

function saveStreak() {
  try { localStorage.setItem('khmer_streak', JSON.stringify(streakData)); } catch(e) {}
}

function saveFavorites() {
  try { localStorage.setItem('khmer_favorites', JSON.stringify(favorites)); } catch(e) {}
}

function isFavorite(id) {
  return !!favorites[id];
}

function toggleFavorite(id) {
  if (favorites[id]) delete favorites[id];
  else favorites[id] = true;
  saveFavorites();
}

// ════════════════════════════════════════
// SRS LOGIC (SM-2)
// ════════════════════════════════════════
function getWordData(id) {
  if (!srs[id]) srs[id] = { interval: 0, ef: 2.5, due: 0, reviews: 0 };
  return srs[id];
}

function rateWord(id, rating) { // 0=hard,1=ok,2=easy
  const d = getWordData(id);
  d.reviews++;
  const now = Date.now();
  if (rating === 0) {
    d.interval = 1;
  } else if (rating === 1) {
    d.interval = d.interval < 1 ? 1 : Math.round(d.interval * d.ef);
    d.ef = Math.max(1.3, d.ef - 0.08);
  } else {
    d.interval = d.interval < 1 ? 4 : Math.round(d.interval * d.ef * 1.3);
    d.ef = Math.min(3.0, d.ef + 0.1);
  }
  d.due = now + d.interval * 86400000;
  srs[id] = d;
  saveSRS();
  updateStreak();
}

function isKnown(id) {
  const d = srs[id];
  return d && d.reviews >= 3 && d.ef >= 2.0;
}

function isDue(id) {
  const d = srs[id];
  if (!d) return false;
  return d.due <= Date.now();
}

function isNew(id) {
  return !srs[id] || srs[id].reviews === 0;
}

// ════════════════════════════════════════
// STREAK
// ════════════════════════════════════════
function updateStreak() {
  const today = new Date().toISOString().slice(0,10);

  // Update streak (once per day)
  if (streakData.lastDate !== today) {
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    streakData.streak = streakData.lastDate === yesterday ? streakData.streak + 1 : 1;
    streakData.lastDate = today;
  }

  // Always increment today's word count
  let entry = streakData.history.find(h => h.date === today);
  if (!entry) {
    entry = {date: today, count: 0};
    streakData.history.push(entry);
  }
  entry.count++;
  if (streakData.history.length > 30) streakData.history = streakData.history.slice(-30);

  saveStreak();
  renderHeader();
}

// ════════════════════════════════════════
// FILTERED WORDS
// ════════════════════════════════════════
function filteredWords() {
  if (state.cat === 'Все') return DICT;
  return DICT.filter(w => w.cat === state.cat);
}

function buildCardQueue() {
  const words = filteredWords();
  const now = Date.now();
  const due = words.filter(w => srs[w.id] && srs[w.id].due <= now && srs[w.id].reviews > 0);
  const fresh = words.filter(w => isNew(w.id)).slice(0,20);
  const queue = [...due, ...fresh].sort(() => Math.random()-0.5);
  return queue;
}

// RENDER HEADER
// ════════════════════════════════════════
function renderHeader() {
  document.getElementById('streak-count').textContent = streakData.streak || 0;
  const known = DICT.filter(w => isKnown(w.id)).length;
  document.getElementById('known-count').textContent = known;
  document.getElementById('total-count').textContent = DICT.length;
}

// FAVORITES SCREEN (standalone)
// ════════════════════════════════════════
function openFavoritesView() {
  state.favoritesOpen = true;
  document.getElementById('cards-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('stats-screen').style.display = 'none';
  document.querySelector('nav').style.display = 'none';
  document.getElementById('category-bar').style.display = 'none';
  document.getElementById('favorites-screen').style.display = 'flex';
  renderFavoritesScreen();
}

function closeFavoritesView() {
  state.favoritesOpen = false;
  document.getElementById('favorites-screen').style.display = 'none';
  document.querySelector('nav').style.display = 'flex';
  document.getElementById('category-bar').style.display = 'flex';
  document.getElementById(state.tab + '-screen').style.display = state.tab === 'stats' ? 'block' : 'flex';
  if (state.tab === 'cards') initCards();
  else if (state.tab === 'quiz') initQuiz();
  else renderStats();
}

function renderFavoritesScreen() {
  const screen = document.getElementById('favorites-screen');
  const favWords = Object.keys(favorites).map(id => DICT.find(w => w.id === Number(id))).filter(Boolean);

  const header = `
    <div class="fav-header">
      <button class="fav-back-btn" id="fav-back-btn">← Назад</button>
      <div class="fav-title">★ Избранное (${favWords.length})</div>
    </div>
  `;

  if (favWords.length === 0) {
    screen.innerHTML = header + `
      <div class="fav-empty">Пока нет избранных слов.<br>Нажмите ☆ на карточке, чтобы добавить сюда.</div>
    `;
    document.getElementById('fav-back-btn').addEventListener('click', closeFavoritesView);
    return;
  }

  const showArrows = favWords.length > 6;

  screen.innerHTML = header +
    (showArrows ? `<button class="fav-nav-arrow" id="fav-up">▲</button>` : '') +
    `<div class="fav-list" id="fav-list">
      ${favWords.map(word => `
        <div class="fav-card-item">
          <input type="checkbox" class="fav-card-flip" id="fav-flip-${word.id}">
          <div class="card-wrap">
            <button class="fav-btn active" data-id="${word.id}" aria-label="Убрать из избранного">★</button>
            <label class="card-label" for="fav-flip-${word.id}">
              <div class="card-face-front">
                <div class="card-khmer">${word.k}</div>
                <div class="card-transcription">${word.l} · ${word.r}</div>
              </div>
              <div class="card-face-back">
                <div class="card-eyebrow">перевод</div>
                <div class="card-russian">${word.ru}</div>
              </div>
            </label>
          </div>
        </div>
      `).join('')}
    </div>` +
    (showArrows ? `<button class="fav-nav-arrow" id="fav-down">▼</button>` : '');

  document.getElementById('fav-back-btn').addEventListener('click', closeFavoritesView);

  // star tap removes the word from favorites — the only way to remove it here
  screen.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(Number(btn.dataset.id));

  if (showArrows) {
    const list = document.getElementById('fav-list');
    document.getElementById('fav-up').addEventListener('click', () => {
      list.scrollBy({ top: -list.clientHeight / 2, behavior: 'smooth' });
    });
    document.getElementById('fav-down').addEventListener('click', () => {
      list.scrollBy({ top: list.clientHeight / 2, behavior: 'smooth' });
    });

}


function initCards() {
  state.cards.queue = buildCardQueue();
  state.cards.idx = 0;
  state.cards.flipped = false;
  state.cards.done = false;
  state.cards.sessionStats = {correct:0, wrong:0};
  renderCard();
}

function renderCard() {
  const screen = document.getElementById('cards-screen');
  const queue  = state.cards.queue;
  const idx    = state.cards.idx;

  if (queue.length === 0 || idx >= queue.length) {
    renderCardsDone();
    return;
  }

  const word    = queue[idx];
  const isKh2ru = state.direction === 'kh2ru';

  // Build front content
  const frontHTML = isKh2ru
    ? `<div class="card-eyebrow">кхмерский</div>
       <div class="card-khmer">${word.k}</div>
       <div class="card-transcription">${word.l} · ${word.r}</div>
       <div class="card-tap-hint"><span>👆</span> нажмите, чтобы открыть</div>`
    : `<div class="card-eyebrow">русский</div>
       <div class="card-russian" style="font-size:32px">${word.ru}</div>
       <div class="card-tap-hint"><span>👆</span> нажмите, чтобы открыть</div>`;

  // Build back content
  const backHTML = isKh2ru
    ? `<div class="card-eyebrow">перевод</div>
       <div class="card-russian">${word.ru}</div>
       <div class="card-rus-trans">${word.r}</div>`
    : `<div class="card-eyebrow">кхмерский</div>
       <div class="card-khmer">${word.k}</div>
       <div class="card-transcription">${word.l} · ${word.r}</div>`;

  screen.innerHTML = `
    <div class="session-info">
      Карточка <strong>${idx+1}</strong> из <strong>${queue.length}</strong>
      &nbsp;·&nbsp; ✓ <strong>${state.cards.sessionStats.correct}</strong>
      &nbsp; ✗ <strong>${state.cards.sessionStats.wrong}</strong>
    </div>

    <input type="checkbox" id="card-flip">

    <div class="card-wrap">
      <button class="fav-btn${isFavorite(word.id) ? ' active' : ''}" id="fav-btn" aria-label="В избранное">${isFavorite(word.id) ? '★' : '☆'}</button>
      <label class="card-label" for="card-flip">
        <div class="card-face-front">${frontHTML}</div>
        <div class="card-face-back">${backHTML}</div>
      </label>
    </div>

    <div class="rating-btns" id="rating-btns">
      <button class="rating-btn btn-hard" data-r="0">Трудно<span class="sub">завтра</span></button>
      <button class="rating-btn btn-ok"   data-r="1">Нормально<span class="sub">×EF</span></button>
      <button class="rating-btn btn-easy" data-r="2">Легко<span class="sub">+</span></button>
    </div>

    <div class="mode-row">
      <button class="direction-toggle" id="dir-toggle">
        <span>${isKh2ru ? 'ខ្មែរ' : 'RU'}</span>
        <span class="arrow">→</span>
        <span>${isKh2ru ? 'RU' : 'ខ្មែរ'}</span>
      </button>
    </div>
  `;

  // Vibrate on flip
  document.getElementById('card-flip').addEventListener('change', () => {
    state.cards.flipped = true;
    vibrate([15]);
  });

  // FAVORITE TOGGLE
  document.getElementById('fav-btn').addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    toggleFavorite(word.id);
    const btn = e.currentTarget;
    const nowFav = isFavorite(word.id);
    btn.classList.toggle('active', nowFav);
    btn.textContent = nowFav ? '★' : '☆';
    vibrate([15]);
  });

  // DIRECTION TOGGLE
  document.getElementById('dir-toggle').addEventListener('click', (e) => {
    e.stopPropagation();
    state.direction = state.direction === 'kh2ru' ? 'ru2kh' : 'kh2ru';
    state.cards.flipped = false;
    renderCard();
  });

  // RATING BUTTONS
  document.getElementById('rating-btns').querySelectorAll('.rating-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = parseInt(btn.dataset.r);
      rateWord(word.id, r);
      if (r === 0) state.cards.sessionStats.wrong++;
      else state.cards.sessionStats.correct++;
      vibrate(r === 0 ? [30,20,30] : [20]);
      state.cards.idx++;
      state.cards.flipped = false;
      renderCard();
      renderHeader();
    });
  });
}

function renderCardsDone() {
  const {correct, wrong} = state.cards.sessionStats;
  const total = correct + wrong;
  const screen = document.getElementById('cards-screen');
  const known = DICT.filter(w => isKnown(w.id)).length;
  screen.innerHTML = `
    <div class="done-card">
      <div class="done-icon">${total === 0 ? '☀️' : correct >= wrong ? '🏆' : '💪'}</div>
      <div class="done-title">${total === 0 ? 'Всё повторено!' : 'Сессия завершена'}</div>
      <div class="done-subtitle">
        ${total > 0
          ? `Карточек сегодня: <strong>${total}</strong><br>Правильно: <strong>${correct}</strong> · Ошибок: <strong>${wrong}</strong><br>Знаю слов: <strong>${known}</strong> из <strong>${DICT.length}</strong>`
          : `Новых слов на сегодня нет.<br>Знаю слов: <strong>${known}</strong> из <strong>${DICT.length}</strong><br>Возвращайтесь завтра!`
        }
      </div>
      <button class="done-btn" id="restart-btn">Начать снова</button>
    </div>
  `;
  document.getElementById('restart-btn').addEventListener('click', initCards);
}

// ════════════════════════════════════════
// QUIZ
// ════════════════════════════════════════
function initQuiz() {
  state.quiz = { current:null, options:[], answered:false, correct:0, wrong:0, count:0 };
  nextQuizQuestion();
}

function nextQuizQuestion() {
  const words = filteredWords();
  if (words.length < 4) {
    document.getElementById('quiz-screen').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🗂️</div>
        <div class="empty-text">В этой категории меньше 4 слов.<br>Выберите другую категорию.</div>
      </div>`;
    return;
  }
  const word = words[Math.floor(Math.random()*words.length)];
  const wrong3 = words.filter(w => w.id !== word.id).sort(()=>Math.random()-0.5).slice(0,3);
  const options = [word, ...wrong3].sort(()=>Math.random()-0.5);
  state.quiz.current = word;
  state.quiz.options = options;
  state.quiz.answered = false;
  renderQuiz();
}

function renderQuiz() {
  const {current, options, correct, wrong, count} = state.quiz;
  const isKh2ru = state.direction === 'kh2ru';
  const total = correct + wrong;
  const progress = count > 0 ? Math.min(1, total/Math.max(count,10)) : 0;
  const screen = document.getElementById('quiz-screen');

  screen.innerHTML = `
    <div class="quiz-progress">
      <span>${total} вопросов</span>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progress*100}%"></div></div>
      <span class="score-correct">✓${correct}</span>
      <span class="score-wrong">✗${wrong}</span>
    </div>

    <div class="quiz-question">
      <div class="card-eyebrow">${isKh2ru ? 'переведите на русский' : 'переведите на кхмерский'}</div>
      ${isKh2ru
        ? `<div class="quiz-khmer">${current.k}</div>
           <div class="card-transcription">${current.l} · ${current.r}</div>`
        : `<div class="card-russian" style="font-size:32px;color:var(--gold)">${current.ru}</div>`
      }
    </div>

    <div class="quiz-options" id="quiz-options">
      ${options.map(opt => {
        const label = isKh2ru ? opt.ru : opt.k;
        return `<button class="quiz-option" data-id="${opt.id}">${label}</button>`;
      }).join('')}
    </div>

    <div class="mode-row">
      <button class="direction-toggle" id="dir-toggle-quiz">
        <span>${isKh2ru ? 'ខ្មែរ' : 'RU'}</span>
        <span class="arrow">→</span>
        <span>${isKh2ru ? 'RU' : 'ខ្មែរ'}</span>
      </button>
    </div>
  `;

  document.getElementById('dir-toggle-quiz').addEventListener('click', () => {
    state.direction = state.direction === 'kh2ru' ? 'ru2kh' : 'kh2ru';
    nextQuizQuestion();
  });

  document.getElementById('quiz-options').querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => answerQuiz(btn));
  });
}

function answerQuiz(btn) {
  if (state.quiz.answered) return;
  state.quiz.answered = true;
  state.quiz.count++;
  const id = parseInt(btn.dataset.id);
  const correct = id === state.quiz.current.id;

  document.querySelectorAll('.quiz-option').forEach(b => {
    if (parseInt(b.dataset.id) === state.quiz.current.id) b.classList.add('correct');
    else if (parseInt(b.dataset.id) === id && !correct) b.classList.add('wrong');
  });

  if (correct) {
    state.quiz.correct++;
    rateWord(id, 1);
    vibrate([20]);
  } else {
    state.quiz.wrong++;
    rateWord(state.quiz.current.id, 0);
    vibrate([30,20,30]);
  }
  renderHeader();
  setTimeout(nextQuizQuestion, 900);
}

// ════════════════════════════════════════
// STATS
// ════════════════════════════════════════
function renderStats() {
  const known = DICT.filter(w => isKnown(w.id)).length;
  const learning = DICT.filter(w => srs[w.id] && srs[w.id].reviews > 0 && !isKnown(w.id)).length;
  const notStarted = DICT.length - known - learning;

  // Weekly chart
  const today = new Date().toISOString().slice(0,10);
  const days = [];
  for (let i=6; i>=0; i--) {
    const d = new Date(Date.now() - i*86400000);
    const ds = d.toISOString().slice(0,10);
    const entry = streakData.history?.find(h => h.date === ds);
    days.push({ label: ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()], count: entry?.count||0, isToday: ds===today });
  }
  const maxCount = Math.max(...days.map(d=>d.count), 1);

  // Category progress
  const catStats = CATS.filter(c=>c!=='Все').map(cat => {
    const words = DICT.filter(w => w.cat === cat);
    const k = words.filter(w => isKnown(w.id)).length;
    return { cat, total: words.length, known: k, pct: Math.round(k/words.length*100) };
  }).sort((a,b) => b.pct - a.pct);

  const screen = document.getElementById('stats-screen');
  screen.innerHTML = `
    <div class="section-title">Прогресс</div>
    <div class="stats-summary">
      <div class="stat-card">
        <div class="stat-num">${known}</div>
        <div class="stat-label">Знаю</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${learning}</div>
        <div class="stat-label">Учу</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${notStarted}</div>
        <div class="stat-label">Не начато</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${Object.keys(favorites).length}</div>
        <div class="stat-label">★ Избранное</div>
      </div>
    </div>

    <div class="section-title">Активность за неделю</div>
    <div class="week-chart">
      <div class="week-bars">
        ${days.map(d => `
          <div class="week-bar-wrap">
            <div class="week-count">${d.count||''}</div>
            <div class="week-bar${d.isToday?' today':''}" style="height:${Math.max(3, Math.round(d.count/maxCount*60))}px"></div>
          </div>
        `).join('')}
      </div>
      <div style="display:flex;gap:6px">
        ${days.map(d => `<div class="week-day" style="flex:1">${d.label}</div>`).join('')}
      </div>
    </div>

    <div class="section-title">По категориям</div>
    <div class="cat-progress-list">
      ${catStats.map(c => `
        <div class="cat-progress-item">
          <div class="cat-progress-row">
            <span class="cat-name">${c.cat}</span>
            <span class="cat-count">${c.known}/${c.total} · ${c.pct}%</span>
          </div>
          <div class="cat-bar-bg">
            <div class="cat-bar-fill" style="width:${c.pct}%"></div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="section-title">Данные</div>
    <div class="actions-row">
      <button class="action-btn" id="export-btn">
        <span class="ico">📤</span> Экспортировать прогресс
      </button>
      <button class="action-btn" id="import-btn">
        <span class="ico">📥</span> Импортировать прогресс
      </button>
      <button class="action-btn danger" id="reset-btn">
        <span class="ico">🗑️</span> Сбросить весь прогресс
      </button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none">
    <div class="bottom-safe"></div>
  `;

  document.getElementById('export-btn').addEventListener('click', exportProgress);
  document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', importProgress);
  document.getElementById('reset-btn').addEventListener('click', showResetModal);
}

// ════════════════════════════════════════
// EXPORT / IMPORT
// ════════════════════════════════════════
function exportProgress() {
  const data = { srs, streakData, favorites, exportedAt: new Date().toISOString(), version: 1 };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `khmer-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  showToast('✅ Прогресс сохранён');
}

function importProgress(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.srs) { srs = data.srs; saveSRS(); }
      if (data.streakData) { streakData = data.streakData; saveStreak(); }
      if (data.favorites) { favorites = data.favorites; saveFavorites(); }
      renderHeader();
      renderStats();
      showToast('✅ Прогресс загружен');
    } catch(err) {
      showToast('❌ Ошибка файла');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

// ════════════════════════════════════════
// RESET MODAL
// ════════════════════════════════════════
function showResetModal() {
  document.getElementById('modal-overlay').classList.add('show');
}

document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
});

document.getElementById('modal-confirm').addEventListener('click', () => {
  srs = {}; streakData = {lastDate:null,streak:0,history:[]}; favorites = {};
  saveSRS(); saveStreak(); saveFavorites();
  document.getElementById('modal-overlay').classList.remove('show');
  renderHeader();
  renderStats();
  showToast('Прогресс сброшен');
});

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('show');
  }
});

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ════════════════════════════════════════
// VIBRATION
// ════════════════════════════════════════
function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ════════════════════════════════════════
// TAB SWITCHING
// ════════════════════════════════════════
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.tab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('cards-screen').style.display = state.tab === 'cards' ? 'flex' : 'none';
    document.getElementById('quiz-screen').style.display   = state.tab === 'quiz'  ? 'flex' : 'none';
    document.getElementById('stats-screen').style.display  = state.tab === 'stats' ? 'flex' : 'none';
    if (state.tab === 'cards') initCards();
    else if (state.tab === 'quiz') initQuiz();
    else renderStats();
  });
});

// ════════════════════════════════════════
// THEME
// ════════════════════════════════════════
function initTheme() {
  const saved = localStorage.getItem('khmer_theme') || 'dark';
  applyTheme(saved);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
  // update browser chrome color
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'light' ? '#f0ede6' : '#1a1f3a';
  localStorage.setItem('khmer_theme', theme);
}

document.getElementById('theme-btn').addEventListener('click', () => {
  const current = localStorage.getItem('khmer_theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

// ════════════════════════════════════════
// BOOT
// ════════════════════════════════════════
loadStorage();
initTheme();
renderCategoryBar();
renderHeader();
initCards();

// Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
